name: CI

# Same-workflow arrangement from vhco-pro/version-workflow's version.yml (contents: write, no App): the
# version job tags with GITHUB_TOKEN and the release job in this run publishes that tag. Trigger and
# concurrency follow its tag-after-checks example: branch pushes, never pull_request, since GitVersion
# needs the real branch and a PR shows these push checks on its head commit.
on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium firefox
      # Mesa's software GL, so Firefox can create a WebGL context; E2E_REQUIRE_WEBGL makes its absence fail.
      - run: sudo apt-get install -y --no-install-recommends libegl1 libgl1-mesa-dri libgles2
      - run: bun run verify
        env:
          APP_COMMIT: ${{ github.sha }}
          E2E_REQUIRE_WEBGL: '1'
      - if: always()
        run: grep -h 'webgl-renderer' .artifacts/webgl.log 2>/dev/null || true
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verify-artifacts
          path: .artifacts
          retention-days: 14

  # Tags main, and a branch whose open PR has the release:preview label at this commit.
  version:
    needs: [checks]
    permissions:
      contents: write
      pull-requests: read
    uses: vhco-pro/version-workflow/.github/workflows/version.yml@46a1ac93fdbd3abaa3a7d17259c5565edd2053c0 # v0.1.2
    with:
      preview-label: release:preview

  release:
    needs: [version]
    if: ${{ needs.version.outputs.tagged == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: image
        uses: michielvha/docker-release-action@c499e52a1a05e5bdd8cf03ba19a423d4c7ec25e3 # v2
        with:
          registry: ghcr.io
          username: vhco-pro
          password: ${{ secrets.GITHUB_TOKEN }}
          project: 3d-assets-gen
          version: ${{ needs.version.outputs.version }}
          platforms: linux/amd64
          context: .
          build-args: |
            APP_VERSION=${{ needs.version.outputs.version }}
            APP_COMMIT=${{ github.sha }}
          trivy-scan: 'true'
          trivy-severity: HIGH,CRITICAL
          trivy-exit-code: '1'
          cosign-sign: 'true'
          sbom: 'true'
          attest-provenance: 'true'
          attest-sbom: 'true'
      # Runs only when the release action succeeded, scan included: no if: always(), no continue-on-error.
      - name: Record the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.version.outputs.version }}
          TAG: ${{ needs.version.outputs.tag }}
          DIGEST: ${{ steps.image.outputs.release-digest }}
          COMMIT: ${{ github.sha }}
        run: bash scripts/ci/release-record.sh
